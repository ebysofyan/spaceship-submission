services:
  - type: web
    name: logistics-analytics
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Secret: set in the Render dashboard. Empty = rules mode (app still works).
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: https://ai.sumopod.com/v1
      - key: AI_MODEL
        value: gpt-6-luna
      - key: AI_REASONING_EFFORT
        value: none
