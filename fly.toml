# Replace app with a globally unique name before `fly launch --no-deploy`.
app = "logistics-analytics"
primary_region = "iad"

[env]
  AI_BASE_URL = "https://ai.sumopod.com/v1"
  AI_MODEL = "gpt-6-luna"
  AI_REASONING_EFFORT = "none"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"   # keep the reviewer URL warm
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
